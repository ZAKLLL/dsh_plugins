# Bundle patch layer for dsh-session-hub.
#
# The row loads this package's main entry (`index.js`) as the Host half, which
# owns the cross-agent session scan and serves it to the browser over the
# shared `/api` Fetch route. The `dsh.client` declaration in package.json makes
# the web app load `client.js` as the browser half.
#
# ## Where a remote machine is declared
#
# Here, or in `~/.ssh/config`, or from the panel — this plugin owns the machine
# list. They are merged in that precedence order (configured, then saved, then
# published, then ssh), and the first source to name an alias describes it, so an
# entry here also *overrides* one that was probed from ssh config — which is how
# a probe that got `home` wrong is corrected.
#
# An entry is only needed for what probbing cannot know: a `dshHome`, a nicer
# `label`, or a host kept out of `~/.ssh/config`.
- insert:
    - id: session-hub
      name: dsh-session-hub
